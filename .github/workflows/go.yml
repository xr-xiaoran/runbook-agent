name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/eval
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: runbook_test
          MYSQL_USER: agent
          MYSQL_PASSWORD: ci-agent-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -run 'TestMySQL|TestRedis' ./internal/agent
        env:
          TEST_MYSQL_DSN: agent:ci-agent-password@tcp(127.0.0.1:3306)/runbook_test?charset=utf8mb4
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - run: docker build -t runbook-agent-ci .
      - run: cp .env.example .env && docker compose up --build -d --wait --wait-timeout 180
      - run: curl -fsS http://127.0.0.1:8084/health
      - if: always()
        run: docker compose logs --no-color && docker compose down
